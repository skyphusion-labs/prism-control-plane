# prism-control-plane deploy template. Copy to wrangler.toml (gitignored) and fill in the ids.
#
# The committed file is a TEMPLATE, matching prism's convention: the live worker deploys from a
# per-deployer wrangler.toml so that database ids and account ids are not baked into git.

name = "prism-control-plane"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# NO *.workers.dev SURFACE. The plane is reached at play-proxy.skyphusion.org and nowhere else; a
# workers.dev hostname would be a second, un-DNS'd door to the same metered routes.
workers_dev = false

# Workers AI binding: required for Deepgram Flux (websocket) and Unified Billing
# non-@cf non-chat (image/video/music). Chat and most @cf HTTP models use CF_AIG_TOKEN.
[ai]
binding = "AI"

# Live voice STT (Deepgram Flux) session bridge.
[[durable_objects.bindings]]
name = "STT_SESSION"
class_name = "SttSession"

# SQLite-backed DO (SttSession uses ctx.storage.sql). new_classes (KV) is rejected on this account.
[[migrations]]
tag = "v1_stt_session"
new_sqlite_classes = ["SttSession"]

[[d1_databases]]
binding = "DB"
database_name = "prism-control-plane"
database_id = "PLACEHOLDER_RUN_wrangler_d1_create_THEN_PASTE_HERE"
# Migrations live in ./migrations/. Apply with:
#   npx wrangler d1 migrations apply prism-control-plane --remote

# The custom domain. Wrangler creates the DNS record and the route for a hostname on a zone in this
# account, so the hostname is IaC rather than a dashboard click.
[[routes]]
pattern = "play-proxy.skyphusion.org"
custom_domain = true

[observability]
enabled = true

# Hourly reconcile dry-run (money writes stay off until RECONCILE_CRON_LIVE=true).
# Removing this disables the cron silently; /admin/reconcile still works by hand.
[triggers]
crons = ["0 * * * *"]

[vars]
# The Cloudflare account inference runs on. A plain var: an account id is not a secret, and having it in
# git is what lets a reviewer see which account this deploy spends against.
CF_ACCOUNT_ID = "fabcb25d9c7eb087110ec474a03e50d2"

# The AI Gateway slug every call routes through. UNSET CLOSES THE INFERENCE DOOR (503) rather than
# calling Cloudflare directly: a metering plane whose traffic bypasses the gateway has thrown away the
# attribution it exists for.
AI_GATEWAY_ID = "prism-proxy"

# Whether AI Gateway keeps a per-request METADATA row. Defaults on; only "false" turns it off.
#
# THIS IS NOT THE PAYLOAD SWITCH. `cf-aig-collect-log-payload: false` is hard-wired in src/upstream.ts with
# no env override, so prompts and completions are never stored either way -- privacy is an invariant here,
# not a setting. This var only decides whether the row holding token counts, model, cost and duration
# exists, and keeping it is what lets Cloudflare's own cost figure be reconciled against our ledger.
# AI_GATEWAY_COLLECT_LOG = "true"

# Cron reconcile: only the literal "true" lets the scheduled tick write money.
# Absent = dry-run only (drift alerts still log). POST /admin/reconcile is independent.
# RECONCILE_CRON_LIVE = "true"
# First-run lookback days when no watermark (1..30, default 7):
# RECONCILE_CRON_INITIAL_LOOKBACK_DAYS = "7"

# Credential posture is SHARED ONLY. Do not set UPSTREAM_CREDENTIAL_MODE=per-user.
#
# Cloudflare caps API tokens at 500 per account, total
# (https://developers.cloudflare.com/fundamentals/api/reference/limits/). One token per Prism account
# would hard-cap the product and starve vivijure's per-tenant minting from the same pool. This plane
# uses one CF_AIG_TOKEN for every request; per-account attribution is cf-aig-metadata + the D1 ledger.
# A leftover per-user value closes inference rather than minting.

# Milliseconds to wait for a model before answering 504. Default 60000, ceiling 120000.
# UPSTREAM_TIMEOUT_MS = "60000"

# Worker secrets (npx wrangler secret put <NAME>):
#
#   CF_AIG_TOKEN       The ONE account-scoped token for all inference and gateway log reads.
#                      AI Gateway Run + Workers AI Read + AI Gateway Read. Required; without it the
#                      inference route answers 503. Never sent to a client. Never used to mint tokens.
#
#   ADMIN_TOKEN        Operator bearer for /admin/*. UNSET means there is no operator surface at all
#                      (every /admin route answers 503), by construction rather than by discipline.
