# Prism Control Plane -- client contract v1, machine-readable.
#
# Hand-authored and kept in step with docs/CONTRACT.md. The prose file is the normative
# explanation (why a code exists, what a client must do); this file is the shape. A route present in
# one and absent from the other is a defect, and tests/contract.test.ts asserts that every route the
# router serves appears here.
#
# NOT generated from code, deliberately. This contract is written BEFORE the clients exist, so the
# implementation follows it rather than the reverse.

openapi: 3.1.0

info:
  title: Prism Control Plane
  version: "1.0.0"
  description: >-
    Metering and policy layer in front of Cloudflare AI Gateway / Workers AI. Owns who may call what
    and how much. Does not store prompt or completion text; see docs/CONTRACT.md for the binding
    privacy invariant.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

servers:
  - url: http://127.0.0.1:8787
    description: Local wrangler dev

tags:
  - name: health
  - name: enrollment
  - name: account
  - name: inference

security:
  - clientKey: []

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness
      description: Always 200 when the Worker is running. Touches no binding.
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                required: [ok, service]
                properties:
                  ok: { const: true }
                  service: { type: string }

  /health/deep:
    get:
      tags: [health]
      summary: Readiness
      description: >-
        Checks D1 reachability, presence of the expected schema, and that every catalog entry is
        priced. Returns 503 when any check fails; a green result here is what makes a deploy
        trustworthy.
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeepHealth" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeepHealth" }

  /v1/clients:
    post:
      tags: [enrollment]
      summary: Enroll a device and receive a client key
      description: >-
        Fail-closed. Requires a single-use, unexpired, account-scoped enrollment token minted out of
        band. The returned secret exists exactly once and cannot be recovered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_token]
              additionalProperties: false
              properties:
                enrollment_token:
                  type: string
                  minLength: 8
                  maxLength: 200
                label:
                  type: string
                  maxLength: 64
                  description: Human label for the device, shown on the operator surface.
                platform:
                  type: string
                  enum: [ios, android, other]
      responses:
        "201":
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                required: [client_id, key, account]
                properties:
                  client_id: { type: string, examples: ["cli_9f2c1a4b7e0d"] }
                  key:
                    type: string
                    description: The bearer key. Shown once. Store in the platform keystore.
                    examples: ["pcp_9f2c1a4b7e0d3c58_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"]
                  account: { $ref: "#/components/schemas/AccountSummary" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403":
          description: >-
            No valid enrollment token, or the target account is suspended. Code `forbidden`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/me:
    get:
      tags: [account]
      summary: Account, plan, entitlements, current usage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [client, account, plan, usage]
                properties:
                  client:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string }
                      label: { type: [string, "null"] }
                      platform: { type: [string, "null"] }
                      created_at: { type: string, format: date-time }
                  account: { $ref: "#/components/schemas/AccountSummary" }
                  plan: { $ref: "#/components/schemas/Plan" }
                  usage: { $ref: "#/components/schemas/Usage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/models:
    get:
      tags: [account]
      summary: Models this caller may call
      description: >-
        Entitlement-filtered. A model the plan does not allow is ABSENT rather than listed and
        forbidden, so a client picker never offers an unusable option.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { const: list }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/usage:
    get:
      tags: [account]
      summary: Current-period usage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/stt/stream:
    get:
      tags: [inference]
      summary: Live voice STT (Deepgram Flux WebSocket)
      description: >-
        WebSocket upgrade only. Auth via Authorization Bearer (preferred) or
        Sec-WebSocket-Protocol `prism.v1, <clientKey>` (browsers). Query tokens are rejected.
        Bridges to @cf/deepgram/flux; meters audio minutes on close (15 min wall-clock cap).
        Requires AI + STT_SESSION bindings.
      responses:
        "101":
          description: Switching Protocols (WebSocket)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/QuotaExhausted" }
        "409": { $ref: "#/components/responses/ModelUnpriced" }
        "503":
          description: AI binding or STT_SESSION Durable Object not configured

  /v1/images/generations:
    post:
      tags: [inference]
      summary: Metered image generation
      description: >-
        Unit-metered image door. Body requires model + prompt. Workers AI (@cf/) uses REST ai/run;
        Unified Billing providers need the Worker AI binding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model: { type: string }
                prompt: { type: string }
      responses:
        "200":
          description: Image (b64_json)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/QuotaExhausted" }
        "409": { $ref: "#/components/responses/ModelUnpriced" }
        "501": { $ref: "#/components/responses/ModelUnsupported" }

  /v1/audio/speech:
    post:
      tags: [inference]
      summary: Metered text-to-speech
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: { type: string }
                input: { type: string }
                text: { type: string }
      responses:
        "200":
          description: Audio (base64)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/QuotaExhausted" }
        "409": { $ref: "#/components/responses/ModelUnpriced" }

  /v1/audio/transcriptions:
    post:
      tags: [inference]
      summary: Metered speech-to-text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, audio]
              properties:
                model: { type: string }
                audio: { type: string, description: base64 or data URL }
      responses:
        "200":
          description: Transcript
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/QuotaExhausted" }
        "409": { $ref: "#/components/responses/ModelUnpriced" }

  /v1/videos/generations:
    post:
      tags: [inference]
      summary: Metered video generation
      description: >-
        Unit-metered video door. Requires the Worker AI binding for Unified Billing providers.
        Long-running models may time out at UPSTREAM_TIMEOUT_MS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string }
                prompt: { type: string }
                image: { type: string }
      responses:
        "200":
          description: Provider result (opaque)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/QuotaExhausted" }
        "409": { $ref: "#/components/responses/ModelUnpriced" }

  /v1/music/generations:
    post:
      tags: [inference]
      summary: Metered music generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model: { type: string }
                prompt: { type: string }
                lyrics: { type: string }
      responses:
        "200":
          description: Provider result (opaque)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/QuotaExhausted" }
        "409": { $ref: "#/components/responses/ModelUnpriced" }

  /v1/chat/completions:
    post:
      tags: [inference]
      summary: Metered inference, OpenAI-compatible
      description: >-
        Gated on entitlement, rate limit, and remaining allowance, then forwarded to AI Gateway /
        Workers AI and metered. Metering facts ride in prism-* response headers so the body stays
        consumable by an OpenAI SDK unchanged. Non-chat models must use their modality doors.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: Completion
          headers:
            prism-request-id: { $ref: "#/components/headers/RequestId" }
            prism-api-version: { $ref: "#/components/headers/ApiVersion" }
            prism-model:
              description: Model actually called.
              schema: { type: string }
            prism-max-tokens-applied:
              description: Output cap actually used after clamping to the plan ceiling.
              schema: { type: integer }
            prism-usage-micro-usd:
              description: Integer micro-USD consumed by this request. 0 when prism-metered is false.
              schema: { type: integer }
            prism-metered:
              description: Whether this request could be priced.
              schema: { type: string, enum: ["true", "false"] }
            prism-usage-recorded:
              description: >-
                Whether the ledger write landed. "false" means this completion was served and not
                charged; it is published rather than swallowed so the gap is visible.
              schema: { type: string, enum: ["true", "false"] }
            prism-stream:
              description: >-
                Present and "true" only on a streamed response. On a stream, prism-usage-micro-usd and
                prism-metered are ABSENT: the token counts arrive in the final SSE frame, after these
                headers were sent, and emitting a zero would read as a free request.
              schema: { type: string, enum: ["true"] }
            prism-period:
              description: >-
                UTC period key YYYY-MM. Scopes monthly allowance; prepaid credit does not reset with it.
              schema: { type: string }
            prism-credit-micro-usd:
              description: Total prepaid credit ever granted to this account (lifetime).
              schema: { type: integer }
            prism-spent-micro-usd:
              description: Lifetime prepaid spend recorded, including this request's credit portion.
              schema: { type: integer }
            prism-credit-remaining-micro-usd:
              description: Prepaid credit left, clamped at 0. Never negative; there is no debt.
              schema: { type: integer }
            prism-monthly-included-micro-usd:
              description: Plan monthly included grant for this period (0 = pure prepaid).
              schema: { type: integer }
            prism-allowance-remaining-micro-usd:
              description: Monthly allowance remaining this period, clamped at 0.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCompletion" }
            text/event-stream:
              description: >-
                Returned when `stream` is true. Cloudflare's own SSE frames, relayed unmodified, ending
                with a usage frame and then `data: [DONE]`. Metering reads that usage frame in passing;
                a stream that omits it is recorded unmetered rather than free.
              schema: { type: string }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402":
          description: >-
            Monthly allowance and prepaid credit are both exhausted. Code `quota_exhausted`.
            Budgetary, not temporal: no overage; retry only after the next period or a credit top-up.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          credit_micro_usd: { type: integer }
                          spent_micro_usd: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The model is not in the catalog at all. Code `model_not_found`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: >-
            Code `model_unpriced`. The model is real and the plan entitles it, but this plane holds no
            per-token rate for it, so serving it would be unmeterable spend. Not 404 and not 403: the
            model returns the moment a rate is set, so a client must not drop it from its picker.
            GET /v1/models publishes `spendable: false` for exactly these.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413":
          description: Request body over the 256 KiB cap. Code `payload_too_large`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "501":
          description: >-
            Either `model_unsupported` (the model's modality has no metered door here: image, video,
            speech and music are listed but not chargeable in token units) or `not_implemented` for a
            v1 feature this deployment does not ship.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "502":
          description: The model or gateway failed. Code `upstream_error`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504":
          description: The model did not answer in time. Code `upstream_timeout`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

components:
  securitySchemes:
    clientKey:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer pcp_<key_id>_<secret>`. Issued once by POST /v1/clients. `key_id` is
        16 lowercase hex characters and is not secret; the 43-character base64url secret is stored
        only as its SHA-256.

  headers:
    RequestId:
      description: Correlation id. Quote it in a support report.
      schema: { type: string }
    ApiVersion:
      description: Always "1" for this contract.
      schema: { const: "1" }

  responses:
    InvalidRequest:
      description: Malformed or out-of-range request. Code `invalid_request`. Never retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthenticated:
      description: >-
        Missing or malformed bearer (`unauthenticated`), or the key has been revoked
        (`client_revoked`). On `client_revoked` a client MUST delete the stored key and re-enroll.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: >-
        Account suspended, enrollment refused (`forbidden`), or the plan does not entitle the
        requested model (`model_not_entitled`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Too many requests. Code `rate_limited`. Honour `retry-after`.
      headers:
        retry-after:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Internal:
      description: Unhandled failure. Code `internal`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unavailable:
      description: >-
        The plane is misconfigured or a dependency is down. Code `unavailable`. This is the
        fail-closed state: an unconfigured gate refuses rather than passing traffic through
        unmetered.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: >-
                Stable machine code. New codes are additive; treat an unrecognized code as a
                non-retryable failure of its HTTP status class.
              enum:
                - invalid_request
                - unauthenticated
                - client_revoked
                - forbidden
                - model_not_entitled
                - model_not_found
                - not_found
                - payload_too_large
                - rate_limited
                - quota_exhausted
                - model_unpriced
                - model_unsupported
                - not_implemented
                - upstream_error
                - upstream_timeout
                - unavailable
                - internal
            message: { type: string }
            request_id: { type: string }
            upstream_status:
              type: integer
              description: Present on upstream_error when the upstream status is known.

    AccountSummary:
      type: object
      required: [id, plan_id, status]
      properties:
        id: { type: string, examples: ["acct_3f8a1c0d9b21"] }
        plan_id: { type: string, examples: ["dev"] }
        status: { type: string, enum: [active, suspended] }

    Plan:
      type: object
      required:
        [
          id,
          name,
          signup_credit_micro_usd,
          monthly_included_micro_usd,
          requests_per_minute,
          max_output_tokens,
          allowed_tiers,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        signup_credit_micro_usd:
          type: integer
          description: >-
            One-time prepaid credit granted when an account is created on this plan, in integer
            micro-USD (1 USD = 1,000,000 micro-USD). Not the monthly allowance.
        monthly_included_micro_usd:
          type: integer
          description: >-
            Monthly included spend for the current UTC period, integer micro-USD. Spent before
            prepaid credit. Zero means pure prepaid. Unused expires at period roll and never becomes
            a credit grant.
        requests_per_minute: { type: integer }
        max_output_tokens: { type: integer }
        allowed_tiers:
          type: array
          items: { type: string, enum: [standard, premium] }

    ModelPrice:
      type: object
      required: [input_micro_usd_per_mtok, output_micro_usd_per_mtok, priced_at, source]
      properties:
        input_micro_usd_per_mtok: { type: integer }
        output_micro_usd_per_mtok: { type: integer }
        priced_at:
          type: string
          format: date
          description: Date the rate was read. A stale rate should look stale, not authoritative.
        source:
          type: string
          enum: [cloudflare, operator]
          description: >-
            Whether this rate came from Cloudflare's published pricing or was set by a Skyphusion
            operator. The two carry different warranties, so the origin is published rather than
            flattened.

    UnitRate:
      type: object
      required: [unit, usd_per_unit]
      description: >-
        A published rate whose unit is not tokens. DISCLOSURE ONLY: this plane charges nothing against
        these, and a client must never use one to compute a cost.
      properties:
        unit: { type: string, examples: ["per 512x512 tile"] }
        usd_per_unit: { type: number }

    Model:
      type: object
      required:
        - id
        - display_name
        - modality
        - billing
        - tier
        - streaming
        - max_output_tokens
        - spendable
        - price
        - published_rates
      properties:
        id: { type: string }
        display_name: { type: string }
        modality:
          type: string
          enum: [chat, image, tts, stt, voice, music, video]
        billing:
          type: string
          enum: [workers-ai, unified-billing]
          description: Which Cloudflare rate card this model bills against.
        tier: { type: string, enum: [standard, premium] }
        streaming: { type: boolean }
        max_output_tokens:
          type: [integer, "null"]
          description: >-
            Vendor ceiling on output tokens, or null when this plane has not verified one. NULL IS NOT
            UNLIMITED: the effective cap is then the plan's alone.
        spendable:
          type: boolean
          description: >-
            Whether this plane will actually run this model. THE FIELD TO BRANCH ON. False when the
            modality is not chat (501 model_unsupported) or when there is no rate (409 model_unpriced).
        price:
          oneOf:
            - $ref: "#/components/schemas/ModelPrice"
            - type: "null"
          description: The rate that will be charged, or null when there is none.
        published_rates:
          type: array
          items: { $ref: "#/components/schemas/UnitRate" }

    Usage:
      type: object
      required:
        - credit_micro_usd
        - spent_micro_usd
        - remaining_micro_usd
        - monthly_included_micro_usd
        - allowance_spent_micro_usd
        - allowance_remaining_micro_usd
        - spendable_remaining_micro_usd
        - overage
        - period
        - period_start
        - period_end
        - period_micro_usd
        - period_requests
        - period_unmetered_requests
        - period_adjust_spend_micro_usd
        - period_adjust_credit_micro_usd
        - period_reconciled_micro_usd
      description: >-
        Two money pools. Prepaid credit (credit_*, spent_*, remaining_micro_usd) is LIFETIME and never
        expires. Monthly allowance (monthly_included_*, allowance_*) is period-scoped, spent first;
        unused expires at period roll and never becomes credit. spendable_remaining_micro_usd is both.


        THE MONTH IS PUBLISHED TWICE for metering: period_micro_usd is the local estimate;
        period_reconciled_micro_usd is corrected against AI Gateway cost.
      properties:
        credit_micro_usd:
          type: integer
          description: Total prepaid credit ever granted to this account.
        spent_micro_usd:
          type: integer
          description: Lifetime prepaid spend (not allowance burn).
        remaining_micro_usd:
          type: integer
          description: >-
            Prepaid credit left, clamped at 0. A single request may overshoot; that is not a debt.
        monthly_included_micro_usd:
          type: integer
          description: Plan monthly included grant for the current period (0 = pure prepaid).
        allowance_spent_micro_usd:
          type: integer
          description: Allowance burned this period.
        allowance_remaining_micro_usd:
          type: integer
          description: Monthly allowance left this period, clamped at 0.
        spendable_remaining_micro_usd:
          type: integer
          description: allowance_remaining + credit remaining (what the pre-flight gate checks).
        overage:
          type: boolean
          description: >-
            Always false. Published as a fact. When both pools are gone the answer is 402.
        period: { type: string, examples: ["2026-08"] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        period_micro_usd:
          type: integer
          description: >-
            This plane's own ESTIMATE for the month, summed from token counts against its rate table.
            Never rewritten by reconciliation, so estimate-versus-billed stays readable.
        period_requests: { type: integer }
        period_unmetered_requests:
          type: integer
          description: >-
            Calls this plane could not price. Should be 0. Exposed rather than hidden so a gap in the
            meter is observable from both ends. Reconciliation is how such a call later acquires its real
            cost, which lands in period_adjust_spend_micro_usd.
        period_adjust_spend_micro_usd:
          type: integer
          description: >-
            Extra charged this month after reconciliation found the biller charged MORE than the
            estimate. Monotonic.
        period_adjust_credit_micro_usd:
          type: integer
          description: >-
            Credit granted back this month after reconciliation found the biller charged LESS than the
            estimate. Monotonic: a downward correction is a credit grant, never a decrement of spend, so
            both money columns can be re-summed against their own audit trails.
        period_reconciled_micro_usd:
          type: integer
          description: >-
            period_micro_usd + period_adjust_spend_micro_usd - period_adjust_credit_micro_usd. The
            month's charge after reconciliation, computed here so every client agrees on it.

    ChatMessage:
      type: object
      required: [role, content]
      additionalProperties: false
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string, maxLength: 200000 }

    ChatRequest:
      type: object
      required: [model, messages]
      additionalProperties: false
      description: >-
        Unknown fields are REJECTED rather than ignored, so a client can never believe it sent a
        parameter that was silently dropped.
      properties:
        model: { type: string }
        messages:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/ChatMessage" }
        max_tokens:
          type: integer
          minimum: 1
          description: Clamped down to the plan ceiling without error.
        temperature: { type: number, minimum: 0, maximum: 2 }
        top_p: { type: number, exclusiveMinimum: 0, maximum: 1 }
        stream:
          type: boolean
          default: false
          description: >-
            Stream the answer as SSE. Supported. The response is Cloudflare's own frames relayed
            unmodified, and the per-request cost headers are absent because the token counts arrive
            after the headers are sent.

    ChatCompletion:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id: { type: string }
        object: { const: chat.completion }
        created: { type: integer, description: Unix seconds. }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index: { type: integer }
              message:
                type: object
                required: [role, content]
                properties:
                  role: { const: assistant }
                  content: { type: string }
              finish_reason: { type: [string, "null"], enum: [stop, length, null] }
        usage:
          type: object
          description: Absent when the upstream reported no usable token counts (an unmetered request).
          required: [prompt_tokens, completion_tokens, total_tokens]
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }

    DeepHealth:
      type: object
      required: [ok, checks]
      properties:
        ok: { type: boolean }
        service: { type: string }
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name: { type: string }
              ok: { type: boolean }
              detail: { type: string }
