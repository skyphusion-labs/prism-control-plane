name: deploy

# TAG-GATED, and only a tag that is already on main.
#
# The committed wrangler.example.toml is a TEMPLATE, not the live config: it carries a placeholder
# database id. The real config is the repo secret PRISM_CONTROL_PLANE_WRANGLER, written to disk here
# and passed with `-c`. That is the estate pattern (postern, common-thread) and it exists because a
# GitHub Actions secret cannot be read back, so the canonical copy lives escrowed in crew-secrets at
# `swarm-secrets/prism-control-plane-wrangler/`. Change one, change all three.
#
# Worker SECRETS are not in that config and must never be added to it. CI writes the config to disk,
# so a bearer placed there would be materialized in the clear on a runner. CF_AIG_TOKEN and
# ADMIN_TOKEN are set once with `wrangler secret put` and persist across deploys.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Public repo: GitHub-hosted only (fork-safe). Never fleet self-hosted.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: deploy
    needs: gate
    # A workflow_dispatch runs the gate and stops. Prod ships from a tag only, so a dispatch can
    # never quietly become a deploy path that skipped review.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on origin/main; refusing to deploy an unreviewed commit"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Materialize the wrangler config
        env:
          WRANGLER_TOML: ${{ secrets.PRISM_CONTROL_PLANE_WRANGLER }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$WRANGLER_TOML" > wrangler.ci.toml
          # Fail loudly rather than deploying a Worker with no database or no gateway. A config that
          # still holds the template placeholder would create a live plane wired to nothing.
          for required in 'database_id' 'AI_GATEWAY_ID' 'play-proxy.skyphusion.org'; do
            grep -q "$required" wrangler.ci.toml || { echo "::error::wrangler config is missing $required"; exit 1; }
          done
          if grep -q 'PLACEHOLDER' wrangler.ci.toml; then
            echo "::error::wrangler config still carries a template placeholder"; exit 1
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply prism-control-plane --remote -c wrangler.ci.toml

      - name: Deploy
        run: npx wrangler deploy -c wrangler.ci.toml

      - name: Smoke test readiness
        run: |
          set -euo pipefail
          # /health/deep is the only smoke test that spends nothing: it reads D1 and reports whether
          # the gateway and the upstream credential are wired, without calling a model. It answers 503
          # when it cannot serve, so this step can actually fail.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o deep.json -w '%{http_code}' --max-time 20 https://play-proxy.skyphusion.org/health/deep || echo 000)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && { cat deep.json; exit 0; }
            sleep 10
          done
          echo "::error::readiness never returned 200 after deploy"
          cat deep.json || true
          exit 1
